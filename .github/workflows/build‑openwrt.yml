name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: Install Dependencies
        uses: openwrt/actions‑setup‑buildenv@main

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cp .config ./
          make defconfig

      - name: Compile firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: firmware‑output
          path: bin/targets/mediatek/mt798x/
